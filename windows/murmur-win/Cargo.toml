[package]
name = "murmur-win"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Murmur for Windows: push-to-talk dictation tray app"

[[bin]]
name = "murmur"
path = "src/main.rs"

[dependencies]
murmur-core = { path = "../murmur-core" }
serde_json = "1"
cpal = "0.15"
hound = "3"
ureq = { version = "2", default-features = false, features = ["json"] }
sherpa-onnx = "2.0.1"
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
