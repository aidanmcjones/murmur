[package]
name = "murmur-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Platform-independent core of Murmur: cleanup, dictionary, vocabulary learning, keystroke replay"

[dependencies]
fancy-regex = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
